{% extends "base.html" %}

{% block title %}Ukryj Produkt{% endblock %}

{% block content %}
<div class="container">
    <h1>Ukryj produkt: {{ product.name }}</h1>
    <p>Podaj powód, dla którego ukrywasz ten produkt. Użytkownik otrzyma powiadomienie.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-danger">Ukryj i powiadom</button>
        <a href="{% url 'admin_panel' %}?view=all_products" class="btn btn-ghost">Anuluj</a>
    </form>
</div>
{% endblock %}
