{% if page_obj.paginator.num_pages > 1 %}
<div class="pagination">
    {% if page_obj.has_previous %}
        <a href="?view={{ view_type }}&page={{ page_obj.previous_page_number }}" class="btn btn-ghost">Poprzednia</a>
    {% endif %}

    <span class="page-current">
        Strona {{ page_obj.number }} z {{ page_obj.paginator.num_pages }}
    </span>

    {% if page_obj.has_next %}
        <a href="?view={{ view_type }}&page={{ page_obj.next_page_number }}" class="btn btn-ghost">Następna</a>
    {% endif %}
</div>
{% endif %}
