{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Odrzuć komentarz</h2>
    <p>Czy na pewno chcesz odrzucić poniższy komentarz?</p>
    
    <div class="card mb-3">
        <div class="card-body">
            <h5 class="card-title">Autor: {{ comment.author.username }}</h5>
            <h6 class="card-subtitle mb-2 text-muted">Produkt: {{ comment.product.name }}</h6>
            <p class="card-text">{{ comment.content }}</p>
        </div>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="reason" class="form-label">Powód odrzucenia:</label>
            <textarea name="reason" id="reason" class="form-control" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-danger">Odrzuć komentarz</button>
        <a href="{% url 'admin_panel' %}" class="btn btn-secondary">Anuluj</a>
    </form>
</div>
{% endblock %}
