{% extends "base.html" %}
{% block title %}Usuń Produkt{% endblock %}

{% block content %}
<div class="container">
    <div class="card" style="padding:1rem;">
        <h2>Usuń produkt</h2>
        <p>Czy na pewno chcesz usunąć <strong>{{ product.name }}</strong>? Tej operacji nie można cofnąć.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary">Usuń</button>
            <a href="{% url 'user_panel' %}" class="btn btn-ghost">Anuluj</a>
        </form>
    </div>
</div>
{% endblock %}
