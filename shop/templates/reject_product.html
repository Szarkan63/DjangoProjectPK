{% extends "base.html" %}
{% block title %}Odrzuć produkt{% endblock %}

{% block content %}
<div class="container">
    <h1>Odrzuć produkt: {{ product.name }}</h1>
    <p>Autor: {{ product.author.username }}</p>

    <form method="post">
        {% csrf_token %}
        <label for="reason">Podaj powód odrzucenia:</label><br>
        <textarea name="reason" id="reason" rows="4" style="width:100%; margin-top:0.5rem;" required></textarea><br><br>
        <button type="submit" class="btn btn-primary">Odrzuć produkt</button>
        <a href="{% url 'admin_panel' %}" class="btn btn-ghost">Anuluj</a>
    </form>
</div>
{% endblock %}
